          import React, { useState, useEffect } from 'react';
          import { View, Text, StyleSheet, Modal, TouchableOpacity } from 'react-native';
          import { COLORS, COIN_RULES } from '../theme/theme';
          import { GradientButton, Card } from '../components/UI';
          import { useApp } from '../context/AppContext';

          export default function AdsScreen({ navigation }) {
            const { user, watchAd, showToast } = useApp();
            const [modal, setModal] = useState(false);
            const [countdown, setCountdown] = useState(5);

            const today = new Date().toDateString();
            const watched = user.lastAdDate === today ? user.adsWatchedToday : 0;
            const remaining = COIN_RULES.DAILY_AD_LIMIT - watched;

            useEffect(() => {
              let timer;
              if (modal && countdown > 0) {
                timer = setTimeout(() => setCountdown(countdown - 1), 1000);
              } else if (modal && countdown === 0) {
                finish();
              }
              return () => clearTimeout(timer);
            }, [modal, countdown]);

            const openAd = () => {
              if (remaining <= 0) {
                showToast('Daily ad limit reached (40).', 'error');
                return;
              }
              setCountdown(5);
              setModal(true);
            };

            const finish = async () => {
              setModal(false);
              const earned = await watchAd();
              if (earned > 0) showToast('+' + earned + ' coins for watching!', 'success');
            };

            return (
              <View style={styles.container}>
                <TouchableOpacity onPress={() => navigation.goBack()} style={styles.back}>
