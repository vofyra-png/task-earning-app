              setPrize(value);
              setRevealed({});
              setDone(false);
            };

            const reveal = async (i) => {
              if (done || prize === null) return;
              const next = Object.assign({}, revealed, { [i]: true });
              setRevealed(next);
              if (Object.keys(next).length >= 8) {
                setDone(true);
                const earned = await scratchCard(prize);
                if (earned > 0) showToast('You won ' + earned + ' coins!', 'success');
              }
            };

            return (
