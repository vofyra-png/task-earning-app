          import React, { useState } from 'react';
          import { View, Text, TextInput, StyleSheet, TouchableOpacity, KeyboardAvoidingView, Platform, ScrollView } from 'react-native';
          import { LinearGradient } from 'expo-linear-gradient';
          import { COLORS } from '../theme/theme';
          import { GradientButton } from '../components/UI';
          import { useApp } from '../context/AppContext';

          export default function AuthScreen() {
            const { signup, login, showToast } = useApp();
            const [mode, setMode] = useState('login');
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [referral, setReferral] = useState('');

            const submit = async () => {
              const fn = mode === 'login' ? login : signup;
              const res = await fn({ username: username.trim(), password, referral: referral.trim() });
              if (!res.ok) showToast(res.error, 'error');
              else showToast(mode === 'login' ? 'Welcome back!' : 'Account created!', 'success');
            };

            return (
              <KeyboardAvoidingView behavior={Platform.OS === 'ios' ? 'padding' : undefined} style={{ flex: 1, backgroundColor: COLORS.bg }}>
                <ScrollView contentContainerStyle={styles.container}>
                  <LinearGradient colors={[COLORS.primary, COLORS.accent]} style={styles.logo}>
                    <Text style={styles.logoText}>AS</Text>
                  </LinearGradient>
                  <Text style={styles.title}>AS Earning App</Text>
                  <Text style={styles.subtitle}>Complete tasks • Earn coins • Withdraw cash</Text>

                  <View style={styles.tabs}>
                    {['login', 'signup'].map((m) => (
                      <TouchableOpacity key={m} onPress={() => setMode(m)} style={[styles.tab, mode === m && styles.tabActive]}>
                        <Text style={[styles.tabText, mode === m && styles.tabTextActive]}>{m === 'login' ? 'Login' : 'Sign Up'}</Text>
                      </TouchableOpacity>
                    ))}
                  </View>

                  <TextInput style={styles.input} placeholder="Username" placeholderTextColor={COLORS.textDim} value={username} onChangeText={setUsername} autoCapitalize="none" />
                  <TextInput style={styles.input} placeholder="Password" placeholderTextColor={COLORS.textDim} value={password} onChangeText={setPassword} secureTextEntry />
                  {mode === 'signup' && (
                    <TextInput style={styles.input} placeholder="Referral code (optional)" placeholderTextColor={COLORS.textDim} value={referral} onChangeText={setReferral} autoCapitalize="characters" />
                  )}

                  <GradientButton title={mode === 'login' ? 'Login' : 'Create Account'} onPress={submit} style={{ marginTop: 8 }} />
                  <Text style={styles.hint}>100 coins = 1 PKR • Max 90 coins per task</Text>
                </ScrollView>
              </KeyboardAvoidingView>
            );
          }

          const styles = StyleSheet.create({
