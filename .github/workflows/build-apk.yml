name: Build AS Earning APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write app source files
        run: |
          mkdir -p src/theme src/utils src/context src/components src/navigation src/screens

          cat > package.json << 'ASEOF'
          {
            "name": "as-earning-app",
            "version": "1.0.0",
            "main": "node_modules/expo/AppEntry.js",
            "scripts": {
              "start": "expo start",
              "android": "expo start --android"
            },
            "dependencies": {
              "expo": "~51.0.28",
              "expo-status-bar": "~1.12.1",
              "react": "18.2.0",
              "react-native": "0.74.5",
              "@react-navigation/native": "^6.1.18",
              "@react-navigation/native-stack": "^6.11.0",
              "@react-navigation/bottom-tabs": "^6.6.1",
              "react-native-screens": "3.31.1",
              "react-native-safe-area-context": "4.10.5",
              "@react-native-async-storage/async-storage": "1.23.1",
              "react-native-svg": "15.2.0",
              "expo-linear-gradient": "~13.0.2"
            },
            "devDependencies": {
              "@babel/core": "^7.24.0"
            },
            "private": true
          }
          ASEOF

          cat > app.json << 'ASEOF'
