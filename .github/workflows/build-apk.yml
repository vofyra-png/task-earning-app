                {WITHDRAW_METHODS.map((m) => (
                  <TouchableOpacity key={m.id} style={[styles.method, method === m.id && styles.methodActive]} onPress={() => setMethod(m.id)}>
                    <Text style={styles.methodIcon}>{m.icon}</Text>
                    <View style={{ flex: 1 }}>
                      <Text style={styles.methodName}>{m.name}</Text>
                      <Text style={styles.methodMin}>Min {m.min} PKR</Text>
                    </View>
                    {method === m.id && <Text style={styles.check}>✓</Text>}
                  </TouchableOpacity>
                ))}

                <Text style={styles.label}>Amount (PKR)</Text>
                <TextInput style={styles.input} placeholder="e.g. 100" placeholderTextColor={COLORS.textDim} value={amount} onChangeText={setAmount} keyboardType="numeric" />

                <Text style={styles.label}>Account Number / Wallet</Text>
                <TextInput style={styles.input} placeholder="03xxxxxxxxx" placeholderTextColor={COLORS.textDim} value={account} onChangeText={setAccount} />

                <GradientButton title="REQUEST WITHDRAWAL" onPress={submit} style={{ marginTop: 8 }} />
                <Text style={styles.note}>Requires verified security code • Min {COIN_RULES.MIN_WITHDRAW_PKR} PKR</Text>
              </ScrollView>
            );
          }

          const styles = StyleSheet.create({
            title: { color: COLORS.text, fontSize: 26, fontWeight: '900' },
            sub: { color: COLORS.textDim, marginTop: 4, marginBottom: 20 },
            label: { color: COLORS.text, fontWeight: '700', marginTop: 16, marginBottom: 8 },
            method: { flexDirection: 'row', alignItems: 'center', backgroundColor: COLORS.card, borderRadius: 14, padding: 14, marginBottom: 10, borderWidth: 1, borderColor: COLORS.border },
            methodActive: { borderColor: COLORS.accent },
            methodIcon: { fontSize: 24, marginRight: 12 },
            methodName: { color: COLORS.text, fontWeight: '700' },
            methodMin: { color: COLORS.textDim, fontSize: 12, marginTop: 2 },
            check: { color: COLORS.accent, fontSize: 20, fontWeight: '900' },
            input: { backgroundColor: COLORS.card, color: COLORS.text, borderRadius: 14, padding: 16, borderWidth: 1, borderColor: COLORS.border },
            note: { color: COLORS.textDim, textAlign: 'center', marginTop: 14, fontSize: 12 },
          });
          ASEOF

          cat > src/screens/WalletScreen.js << 'ASEOF'
          import React from 'react';
          import { View, Text, StyleSheet, ScrollView } from 'react-native';
          import { COLORS, COIN_RULES } from '../theme/theme';
          import { Card, SectionTitle } from '../components/UI';
          import { useApp } from '../context/AppContext';

          export default function WalletScreen() {
            const { user } = useApp();
            const pkr = (user.coins / COIN_RULES.COINS_PER_PKR).toFixed(2);

            return (
              <ScrollView style={{ flex: 1, backgroundColor: COLORS.bg }} contentContainerStyle={{ padding: 16, paddingTop: 50 }}>
                <Text style={styles.title}>👛 Wallet</Text>

                <Card style={styles.balanceCard}>
                  <Text style={styles.balanceLabel}>Coin Balance</Text>
                  <Text style={styles.balanceValue}>🪙 {user.coins}</Text>
                  <Text style={styles.balancePkr}>≈ {pkr} PKR</Text>
                </Card>

                <SectionTitle>Conversion Rate</SectionTitle>
                <Card>
                  <Text style={styles.rate}>{COIN_RULES.COINS_PER_PKR} coins = 1 PKR</Text>
                  <Text style={styles.rateSub}>Minimum withdrawal: {COIN_RULES.MIN_WITHDRAW_PKR} PKR</Text>
                </Card>

                <SectionTitle>Coin Limits</SectionTitle>
                <Card>
                  <Text style={styles.limit}>Max per task: {COIN_RULES.MAX_COINS_PER_TASK} coins</Text>
                  <Text style={styles.limit}>Spin reward: {COIN_RULES.SPIN_MIN}–{COIN_RULES.SPIN_MAX} coins</Text>
                  <Text style={styles.limit}>Scratch reward: {COIN_RULES.SCRATCH_MIN}–{COIN_RULES.SCRATCH_MAX} coins</Text>
                  <Text style={styles.limit}>Ad reward: {COIN_RULES.AD_REWARD} coins</Text>
                  <Text style={styles.limit}>Daily ad limit: {COIN_RULES.DAILY_AD_LIMIT} ads</Text>
                </Card>

                <SectionTitle>Recent Activity</SectionTitle>
                {(user.history || []).length === 0 ? (
                  <Card><Text style={styles.empty}>No activity yet. Start earning!</Text></Card>
                ) : (
                  (user.history || []).map((h, i) => (
                    <Card key={i} style={styles.historyRow}>
                      <Text style={styles.historyLabel}>{h.label}</Text>
                      <Text style={[styles.historyAmount, { color: h.amount >= 0 ? COLORS.accent : COLORS.danger }]}>
                        {h.amount >= 0 ? '+' : ''}{h.amount}
                      </Text>
                    </Card>
                  ))
                )}
                <View style={{ height: 30 }} />
              </ScrollView>
            );
          }

          const styles = StyleSheet.create({
            title: { color: COLORS.text, fontSize: 26, fontWeight: '900', marginBottom: 16 },
            balanceCard: { alignItems: 'center' },
            balanceLabel: { color: COLORS.textDim, fontSize: 14 },
            balanceValue: { color: COLORS.gold, fontSize: 36, fontWeight: '900', marginTop: 6 },
            balancePkr: { color: COLORS.text, fontSize: 16, marginTop: 4 },
            rate: { color: COLORS.text, fontSize: 16, fontWeight: '700' },
            rateSub: { color: COLORS.textDim, marginTop: 6 },
            limit: { color: COLORS.textDim, marginTop: 6 },
            empty: { color: COLORS.textDim, textAlign: 'center' },
            historyRow: { flexDirection: 'row', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10, paddingVertical: 12 },
            historyLabel: { color: COLORS.text, flex: 1 },
            historyAmount: { fontWeight: '800', fontSize: 16 },
          });
          ASEOF

          cat > src/screens/ProfileScreen.js << 'ASEOF'
          import React from 'react';
          import { View, Text, StyleSheet, ScrollView } from 'react-native';
          import { COLORS } from '../theme/theme';
          import { Card, GradientButton } from '../components/UI';
          import { useApp } from '../context/AppContext';

          export default function ProfileScreen() {
            const { user, logout } = useApp();

            return (
              <ScrollView style={{ flex: 1, backgroundColor: COLORS.bg }} contentContainerStyle={{ padding: 16, paddingTop: 50 }}>
                <Text style={styles.title}>👤 Profile</Text>

                <Card style={styles.profileCard}>
                  <View style={styles.avatar}><Text style={styles.avatarText}>{user.username.charAt(0).toUpperCase()}</Text></View>
                  <Text style={styles.username}>{user.username}</Text>
                  <Text style={styles.coins}>🪙 {user.coins} coins</Text>
                </Card>

                <Card style={styles.infoCard}>
                  <View style={styles.row}><Text style={styles.rowLabel}>Referral Code</Text><Text style={styles.rowValue}>{user.referralCode}</Text></View>
                  <View style={styles.row}><Text style={styles.rowLabel}>Security</Text><Text style={styles.rowValue}>{user.securityVerified ? 'Verified ✅' : 'Not verified'}</Text></View>
                  <View style={styles.row}><Text style={styles.rowLabel}>Tasks Done</Text><Text style={styles.rowValue}>{user.completedTasks.length}</Text></View>
                  <View style={styles.row}><Text style={styles.rowLabel}>Member Since</Text><Text style={styles.rowValue}>{new Date(user.createdAt).toLocaleDateString()}</Text></View>
                </Card>

                <GradientButton title="LOGOUT" onPress={logout} colors={[COLORS.danger, '#B23A52']} style={{ marginTop: 20 }} />
              </ScrollView>
            );
          }

          const styles = StyleSheet.create({
            title: { color: COLORS.text, fontSize: 26, fontWeight: '900', marginBottom: 16 },
            profileCard: { alignItems: 'center', marginBottom: 16 },
            avatar: { width: 80, height: 80, borderRadius: 40, backgroundColor: COLORS.primary, alignItems: 'center', justifyContent: 'center' },
            avatarText: { color: '#fff', fontSize: 34, fontWeight: '900' },
            username: { color: COLORS.text, fontSize: 20, fontWeight: '800', marginTop: 12 },
            coins: { color: COLORS.gold, fontSize: 16, marginTop: 4 },
            infoCard: {},
            row: { flexDirection: 'row', justifyContent: 'space-between', paddingVertical: 10, borderBottomWidth: 1, borderBottomColor: COLORS.border },
            rowLabel: { color: COLORS.textDim },
            rowValue: { color: COLORS.text, fontWeight: '700' },
          });
          ASEOF

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo prebuild (generate Android project)
        run: npx expo prebuild --platform android --no-install

      - name: Set Android SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: as-earning-app-apk
          path: android/app/build/outputs/apk/release/*.apk
