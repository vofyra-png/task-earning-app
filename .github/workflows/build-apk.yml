            subtitle: { color: COLORS.textDim, textAlign: 'center', marginTop: 6, marginBottom: 24 },
            tabs: { flexDirection: 'row', backgroundColor: COLORS.card, borderRadius: 14, padding: 4, marginBottom: 16 },
            tab: { flex: 1, paddingVertical: 10, borderRadius: 10, alignItems: 'center' },
            tabActive: { backgroundColor: COLORS.primary },
            tabText: { color: COLORS.textDim, fontWeight: '700' },
            tabTextActive: { color: '#fff' },
            input: { backgroundColor: COLORS.card, color: COLORS.text, borderRadius: 14, padding: 16, marginBottom: 12, borderWidth: 1, borderColor: COLORS.border },
            hint: { color: COLORS.textDim, textAlign: 'center', marginTop: 16, fontSize: 12 },
