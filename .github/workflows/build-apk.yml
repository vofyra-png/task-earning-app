          export default function WithdrawScreen() {
            const { user, requestWithdraw, showToast } = useApp();
            const [method, setMethod] = useState(WITHDRAW_METHODS[0].id);
            const [amount, setAmount] = useState('');
            const [account, setAccount] = useState('');

            const submit = async () => {
              const amt = parseFloat(amount);
              if (!amt || amt <= 0) {
                showToast('Enter a valid amount.', 'error');
                return;
              }
              if (!account.trim()) {
                showToast('Enter your account number.', 'error');
                return;
              }
              const ok = await requestWithdraw(method, amt, account.trim());
              if (ok) {
                showToast('Withdrawal request submitted!', 'success');
                setAmount('');
                setAccount('');
              }
            };

            return (
              <ScrollView style={{ flex: 1, backgroundColor: COLORS.bg }} contentContainerStyle={{ padding: 16, paddingTop: 50 }}>
                <Text style={styles.title}>💸 Withdraw</Text>
                <Text style={styles.sub}>Balance: 🪙 {user.coins} ({(user.coins / COIN_RULES.COINS_PER_PKR).toFixed(2)} PKR)</Text>

