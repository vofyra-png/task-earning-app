                </TouchableOpacity>
                <Text style={styles.title}>📺 Watch Ads & Earn</Text>
                <Text style={styles.sub}>+{COIN_RULES.AD_REWARD} coins per ad • {COIN_RULES.DAILY_AD_LIMIT} ads/day</Text>

