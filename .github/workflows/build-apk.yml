          ];

          export const TASKS = [
            { id: 't1', title: 'Watch a short video', reward: 25, icon: '🎬' },
            { id: 't2', title: 'Visit a website', reward: 20, icon: '🌐' },
            { id: 't3', title: 'Install & open app', reward: 40, icon: '📱' },
            { id: 't4', title: 'Complete a survey', reward: 60, icon: '📝' },
            { id: 't5', title: 'Share on social media', reward: 30, icon: '📢' },
            { id: 't6', title: 'Sign up on partner site', reward: 90, icon: '🔗' },
          ];
