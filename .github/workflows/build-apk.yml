          import React, { useRef, useState } from 'react';
          import { View, Text, StyleSheet, Animated, Easing, TouchableOpacity } from 'react-native';
          import Svg, { G, Path, Text as SvgText } from 'react-native-svg';
          import { COLORS, COIN_RULES } from '../theme/theme';
          import { GradientButton } from '../components/UI';
          import { useApp } from '../context/AppContext';

          const SEGMENTS = [5, 10, 20, 30, 50, 90, 15, 25];
          const SEG_COLORS = ['#6C5CE7', '#00D9A6', '#FFC93C', '#FF5C7A', '#4B3FBF', '#00B894', '#E17055', '#0984E3'];
          const SIZE = 280;
          const R = SIZE / 2;
          const SEG_ANGLE = 360 / SEGMENTS.length;

          function polar(cx, cy, r, angleDeg) {
            const a = ((angleDeg - 90) * Math.PI) / 180;
            return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
          }

          function segmentPath(cx, cy, r, startAngle, endAngle) {
            const start = polar(cx, cy, r, endAngle);
            const end = polar(cx, cy, r, startAngle);
            const largeArc = endAngle - startAngle <= 180 ? 0 : 1;
            return 'M ' + cx + ' ' + cy + ' L ' + start.x + ' ' + start.y + ' A ' + r + ' ' + r + ' 0 ' + largeArc + ' 0 ' + end.x + ' ' + end.y + ' Z';
          }

          export default function SpinScreen({ navigation }) {
            const { spinWheel, showToast } = useApp();
            const rotation = useRef(new Animated.Value(0)).current;
            const [spinning, setSpinning] = useState(false);
            const [result, setResult] = useState(null);

            const spin = () => {
              if (spinning) return;
              setSpinning(true);
              setResult(null);
              const idx = Math.floor(Math.random() * SEGMENTS.length);
              const value = SEGMENTS[idx];
              const target = 360 * 5 + (360 - idx * SEG_ANGLE - SEG_ANGLE / 2);
              rotation.setValue(0);
              Animated.timing(rotation, {
                toValue: target,
                duration: 3500,
                easing: Easing.out(Easing.cubic),
                useNativeDriver: true,
              }).start(async () => {
                const earned = await spinWheel(value);
                if (earned > 0) {
                  setResult(earned);
                  showToast('You won ' + earned + ' coins!', 'success');
                }
                setSpinning(false);
              });
            };

            const rotate = rotation.interpolate({ inputRange: [0, 360], outputRange: ['0deg', '360deg'] });

            return (
              <View style={styles.container}>
                <TouchableOpacity onPress={() => navigation.goBack()} style={styles.back}>
                  <Text style={styles.backText}>← Back</Text>
                </TouchableOpacity>
                <Text style={styles.title}>🎡 Spin & Win</Text>
                <Text style={styles.sub}>Max {COIN_RULES.SPIN_MAX} coins per spin</Text>

                <View style={styles.wheelWrap}>
                  <Animated.View style={{ transform: [{ rotate }] }}>
                    <Svg width={SIZE} height={SIZE}>
                      <G>
                        {SEGMENTS.map((val, i) => {
                          const start = i * SEG_ANGLE;
                          const end = start + SEG_ANGLE;
                          const mid = start + SEG_ANGLE / 2;
                          const labelPos = polar(R, R, R * 0.62, mid);
                          return (
                            <G key={i}>
                              <Path d={segmentPath(R, R, R - 4, start, end)} fill={SEG_COLORS[i]} stroke="#0B1020" strokeWidth="2" />
                              <SvgText x={labelPos.x} y={labelPos.y} fill="#fff" fontSize="16" fontWeight="bold" textAnchor="middle">{val}</SvgText>
                            </G>
                          );
                        })}
                      </G>
                    </Svg>
                  </Animated.View>
                  <View style={styles.pointer} />
                </View>

                {result !== null && <Text style={styles.result}>🎉 You won {result} coins!</Text>}

                <GradientButton title={spinning ? 'Spinning...' : 'SPIN NOW'} onPress={spin} disabled={spinning} style={{ width: '80%', marginTop: 24 }} />
              </View>
            );
          }

          const styles = StyleSheet.create({
            container: { flex: 1, backgroundColor: COLORS.bg, alignItems: 'center', paddingTop: 50 },
            back: { alignSelf: 'flex-start', marginLeft: 20, marginBottom: 10 },
            backText: { color: COLORS.textDim, fontSize: 16 },
            title: { color: COLORS.text, fontSize: 26, fontWeight: '900' },
            sub: { color: COLORS.textDim, marginTop: 4, marginBottom: 20 },
            wheelWrap: { alignItems: 'center', justifyContent: 'center' },
            pointer: { position: 'absolute', top: -6, width: 0, height: 0, borderLeftWidth: 14, borderRightWidth: 14, borderTopWidth: 26, borderLeftColor: 'transparent', borderRightColor: 'transparent', borderTopColor: COLORS.gold },
            result: { color: COLORS.accent, fontSize: 20, fontWeight: '800', marginTop: 20 },
          });
